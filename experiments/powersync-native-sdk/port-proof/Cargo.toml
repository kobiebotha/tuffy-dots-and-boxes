[package]
name = "badge-native-sdk-embassy-proof"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
powersync = { path = "../../../../powersync-native/powersync", default-features = false, features = ["embassy"] }
powersync_sqlite_nostd = { version = "=0.5.4", default-features = false, features = ["static"] }
embassy-executor = { version = "0.10.0", default-features = false }
async-channel = { version = "2.5.0", default-features = false }
async-trait = "0.1.89"
bytes = { version = "1", default-features = false }
futures-lite = { version = "2.6.1", default-features = false, features = ["alloc"] }
log = { version = "0.4", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc", "raw_value"] }

[profile.release]
panic = "abort"
